# Managed by MiniVercel. Regenerated whenever builds are re-enabled.
# Deploys macbook-react-jsx from the dist/ directory on every push to master.
name: Deploy to MiniVercel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: minivercel-macbook-react-jsx
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::No index.html in dist/ after the build."
            exit 1
          fi
          cd "dist" && zip -qr "$RUNNER_TEMP/site.zip" .

      - name: Upload to MiniVercel
        env:
          DEPLOY_TOKEN: ${{ secrets.MINIVERCEL_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::MINIVERCEL_TOKEN is not set. Re-enable builds in MiniVercel."
            exit 1
          fi
          curl -f -sS -X POST "https://minivercel.onrender.com/api/deployments" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "X-Commit-Sha: ${{ github.sha }}" \
            -F "file=@$RUNNER_TEMP/site.zip"
